name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the model and build tests
        run: npm test
      - name: Rebuild the page
        run: npm run build
      - name: Fail if the committed page is stale
        run: git diff --exit-code -- index.html
