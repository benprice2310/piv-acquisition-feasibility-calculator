.form-range::-moz-range-track {

  background: transparent;
}

.form-range::-moz-range-thumb {

.form-range:focus-visible::-moz-range-thumb {

.btn:not(.btn-primary, .viz-tile):is(

  background: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

svg {

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;piv-retention-tool&quot; class=&quot;prt-root&quot;&gt;
  &lt;div class=&quot;prt-sections&quot;&gt;
    &lt;section&gt;
      &lt;h3&gt;Timing and flow&lt;/h3&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-rate&quot;&gt;Laser pair rate &lt;span class=&quot;text-muted&quot;&gt;Hz&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-rate&quot; type=&quot;number&quot; min=&quot;0.1&quot; max=&quot;10000&quot; step=&quot;0.1&quot; value=&quot;15&quot; data-tooltip=&quot;Number of PIV image pairs acquired per second. This sets measurement cadence, not the time between pulses within a pair.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-dt&quot;&gt;Pulse-pair separation &lt;span class=&quot;text-muted&quot;&gt;ms&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-dt&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;1000&quot; step=&quot;0.01&quot; value=&quot;1.00&quot; data-tooltip=&quot;Time between the two laser pulses used for one velocity calculation. Shorten it to reduce particle displacement and sheet loss.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-mean&quot;&gt;Mean in-plane speed &lt;span class=&quot;text-muted&quot;&gt;m/s&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-mean&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;0.01&quot; value=&quot;0.50&quot; data-tooltip=&quot;Expected mean particle speed parallel to the laser sheet. Use the largest relevant speed in the field of view.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-urms&quot;&gt;In-plane RMS fluctuation &lt;span class=&quot;text-muted&quot;&gt;m/s&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-urms&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;0.01&quot; value=&quot;0.10&quot; data-tooltip=&quot;RMS turbulent velocity fluctuation parallel to the sheet. It is added to the mean using the selected design multiplier.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-k&quot;&gt;Design multiplier &lt;span class=&quot;text-muted&quot;&gt;RMS&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-k&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;3&quot; data-tooltip=&quot;Safety multiplier applied to RMS fluctuations. Three RMS is conservative when fluctuations are approximately Gaussian.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;div class=&quot;form-check form-switch&quot;&gt;
          &lt;input class=&quot;form-check-input&quot; id=&quot;prt-laser-fixed&quot; type=&quot;checkbox&quot; checked data-tooltip=&quot;When enabled, recommendations prioritize processing changes and clearly identify limits that processing cannot recover.&quot; data-tooltip-placement=&quot;top&quot;&gt;
          &lt;label class=&quot;form-check-label&quot; for=&quot;prt-laser-fixed&quot;&gt;Laser timing fixed&lt;/label&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section&gt;
      &lt;h3&gt;Image-plane retention&lt;/h3&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-fov&quot;&gt;Field-of-view width &lt;span class=&quot;text-muted&quot;&gt;mm&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-fov&quot; type=&quot;number&quot; min=&quot;0.01&quot; max=&quot;100000&quot; step=&quot;0.1&quot; value=&quot;100&quot; data-tooltip=&quot;Physical width represented by the image. Together with image width, this determines millimetres per pixel.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-pixels&quot;&gt;Image width &lt;span class=&quot;text-muted&quot;&gt;pixels&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-pixels&quot; type=&quot;number&quot; min=&quot;16&quot; max=&quot;100000&quot; step=&quot;1&quot; value=&quot;2048&quot; data-tooltip=&quot;Number of camera pixels spanning the stated field-of-view width after any cropping or binning.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-window&quot;&gt;Interrogation window &lt;span class=&quot;text-muted&quot;&gt;pixels&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-window&quot; type=&quot;number&quot; min=&quot;4&quot; max=&quot;1024&quot; step=&quot;4&quot; value=&quot;32&quot; data-tooltip=&quot;Final PIV interrogation-window width. Larger windows tolerate more displacement but reduce spatial resolution.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-shift-fraction&quot;&gt;Allowed window displacement &lt;span class=&quot;text-muted&quot;&gt;%&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-shift-fraction&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;25&quot; data-tooltip=&quot;Maximum particle-image displacement as a fraction of the interrogation window. Twenty-five percent is a conservative starting point.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-overlap&quot;&gt;Window overlap &lt;span class=&quot;text-muted&quot;&gt;%&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-overlap&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;95&quot; step=&quot;5&quot; value=&quot;50&quot; data-tooltip=&quot;Overlap between adjacent interrogation windows. It reduces vector spacing but does not recover spatial resolution filtered by the window size.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-structure&quot;&gt;Desired structure length &lt;span class=&quot;text-muted&quot;&gt;mm&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-structure&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;100000&quot; step=&quot;0.1&quot; value=&quot;50&quot; data-tooltip=&quot;Smallest flow-structure length you want to resolve. It is checked independently against interrogation-window size, vector spacing, and temporal sampling.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section&gt;
      &lt;h3&gt;Laser-sheet retention&lt;/h3&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-sheet&quot;&gt;Sheet thickness &lt;span class=&quot;text-muted&quot;&gt;mm&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-sheet&quot; type=&quot;number&quot; min=&quot;0.001&quot; max=&quot;1000&quot; step=&quot;0.1&quot; value=&quot;2.0&quot; data-tooltip=&quot;Effective illuminated sheet thickness at the measurement plane. Use the region with sufficient particle-image intensity, not merely the nominal optical width.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-wrms&quot;&gt;Out-of-plane RMS speed &lt;span class=&quot;text-muted&quot;&gt;mm/s&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-wrms&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;0.1&quot; value=&quot;2.0&quot; data-tooltip=&quot;RMS velocity normal to the laser sheet. This component moves particles out of the illuminated measurement plane.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;prt-sheet-fraction&quot;&gt;Allowed sheet traversal &lt;span class=&quot;text-muted&quot;&gt;%&lt;/span&gt;
          &lt;input class=&quot;form-control&quot; id=&quot;prt-sheet-fraction&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;25&quot; data-tooltip=&quot;Allowed out-of-plane travel as a fraction of sheet thickness. A smaller value preserves more common particles between images.&quot; data-tooltip-placement=&quot;top&quot;&gt;
        &lt;/label&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-row prt-actions&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;prt-use-rate&quot;&gt;Use single-pulse interval&lt;/button&gt;
    &lt;span class=&quot;text-small text-muted&quot; id=&quot;prt-cadence-note&quot;&gt;15 Hz gives one velocity field every 66.7 ms; pulse-pair separation is independent.&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-grid prt-stats&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;span class=&quot;text-muted&quot;&gt;In-plane displacement&lt;/span&gt;
      &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-shift-value&quot;&gt;16.4 px&lt;/span&gt;
      &lt;span id=&quot;prt-shift-limit&quot;&gt;limit 8.0 px&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;span class=&quot;text-muted&quot;&gt;Out-of-plane travel&lt;/span&gt;
      &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-sheet-value&quot;&gt;0.006 mm&lt;/span&gt;
      &lt;span id=&quot;prt-sheet-limit&quot;&gt;limit 0.500 mm&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;span class=&quot;text-muted&quot;&gt;Recommended pair separation&lt;/span&gt;
      &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-recommended&quot;&gt;≤ 0.39 ms&lt;/span&gt;
      &lt;span id=&quot;prt-limiter&quot;&gt;limited by image displacement&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;svg class=&quot;prt-chart&quot; viewBox=&quot;0 0 736 250&quot; role=&quot;img&quot; aria-labelledby=&quot;prt-title prt-desc&quot;&gt;
    &lt;title id=&quot;prt-title&quot;&gt;PIV pulse-pair separation operating range&lt;/title&gt;
    &lt;desc id=&quot;prt-desc&quot;&gt;A logarithmic time axis compares the chosen pulse separation with image-plane and laser-sheet retention limits. The conservative zone includes a twenty percent margin.&lt;/desc&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;card prt-result&quot; aria-live=&quot;polite&quot;&gt;
    &lt;strong id=&quot;prt-status&quot;&gt;Reduce pulse-pair separation&lt;/strong&gt;
    &lt;span id=&quot;prt-result-detail&quot;&gt;The current particle-image shift exceeds the configured correlation limit.&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;prt-sampling-section&quot;&gt;
    &lt;h3&gt;Flow-structure sampling across successive PIV fields&lt;/h3&gt;
    &lt;svg class=&quot;prt-sampling-chart&quot; viewBox=&quot;0 0 736 410&quot; role=&quot;img&quot; aria-labelledby=&quot;prt-sampling-title prt-sampling-desc&quot;&gt;
      &lt;title id=&quot;prt-sampling-title&quot;&gt;Resolvable structure length and convection velocity at the selected repetition rate&lt;/title&gt;
      &lt;desc id=&quot;prt-sampling-desc&quot;&gt;A log-log chart separates structures with fewer than two samples, two to five samples, and at least five samples as they pass through the measurement plane.&lt;/desc&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;card prt-sampling-result&quot; aria-live=&quot;polite&quot;&gt;
      &lt;span id=&quot;prt-frequency-limits&quot;&gt;Frequency limits: 7.5 Hz theoretical and 3.0 Hz conservative.&lt;/span&gt;
      &lt;span id=&quot;prt-length-limits&quot;&gt;At the design velocity: 107 mm theoretical and 267 mm conservative.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid prt-checks&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Particle-pair retention&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-pair-check&quot;&gt;Likely loss&lt;/span&gt;
        &lt;span id=&quot;prt-pair-context&quot;&gt;Reduce pulse-pair separation&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Spatial structure resolution&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-spatial-check&quot;&gt;10.0 window widths&lt;/span&gt;
        &lt;span id=&quot;prt-spatial-context&quot;&gt;20.0 plotted vectors across structure&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Temporal structure sampling&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot; id=&quot;prt-temporal-check&quot;&gt;0.94 fields&lt;/span&gt;
        &lt;span id=&quot;prt-temporal-context&quot;&gt;Fewer than two samples&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;prt-recommendation-section&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;viz-row prt-recommendation-heading&quot;&gt;
      &lt;h3&gt;Parameter-based recommendations&lt;/h3&gt;
      &lt;span class=&quot;viz-badge&quot; id=&quot;prt-recommendation-mode&quot;&gt;Fixed laser timing&lt;/span&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;prt-recommendation-list&quot; id=&quot;prt-recommendations&quot;&gt;&lt;/ol&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;Recommendations are planning guidance. Confirm them with correlation maps, uncertainty estimates, and a parameter-sensitivity check on representative image pairs.&lt;/p&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;style&gt;
  #piv-retention-tool { width: 100%; color: var(--foreground); }
  #piv-retention-tool .prt-sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

  #piv-retention-tool .prt-rate-line { stroke: var(--muted-foreground); stroke-width: 2; stroke-dasharray: 3 4; }
  #piv-retention-tool .prt-tick,

  #piv-retention-tool .prt-tick { fill: var(--muted-foreground); }
  #piv-retention-tool .prt-label { font-weight: 500; paint-order: stroke; stroke: var(--background); stroke-width: 5; stroke-linejoin: round; }

  #piv-retention-tool .prt-sampling-grid { stroke: var(--border); stroke-width: 1; }
  #piv-retention-tool .prt-sampling-axis { stroke: var(--muted-foreground); stroke-width: 1.25; }
  #piv-retention-tool .prt-sampling-unresolved { fill: var(--muted); opacity: 0.45; }
  #piv-retention-tool .prt-sampling-theory-zone { fill: var(--viz-series-1); opacity: 0.13; }
  #piv-retention-tool .prt-sampling-conservative-zone { fill: var(--viz-series-2); opacity: 0.13; }
  #piv-retention-tool .prt-sampling-theory-line { stroke: var(--viz-series-1); stroke-width: 2.5; }
  #piv-retention-tool .prt-sampling-conservative-line { stroke: var(--viz-series-2); stroke-width: 2.5; stroke-dasharray: 9 6; }
  #piv-retention-tool .prt-sampling-flow-band { fill: var(--viz-series-3); opacity: 0.13; }
  #piv-retention-tool .prt-sampling-mean-line { stroke: var(--viz-series-3); stroke-width: 2; stroke-dasharray: 4 5; }
  #piv-retention-tool .prt-sampling-speed-line { stroke: var(--viz-series-3); stroke-width: 2.5; }
  #piv-retention-tool .prt-sampling-structure-line { stroke: var(--foreground); stroke-width: 2.5; stroke-dasharray: 3 4; }
  #piv-retention-tool .prt-sampling-theory-marker { fill: var(--background); stroke: var(--viz-series-1); stroke-width: 3; }
  #piv-retention-tool .prt-sampling-conservative-marker { fill: var(--viz-series-2); stroke: var(--background); stroke-width: 2; }
  #piv-retention-tool .prt-sampling-label,
  #piv-retention-tool .prt-sampling-tick { fill: var(--foreground); font-family: inherit; font-size: var(--font-size-base); }
  #piv-retention-tool .prt-sampling-tick { fill: var(--muted-foreground); }
  #piv-retention-tool .prt-sampling-label { font-weight: 500; paint-order: stroke; stroke: var(--background); stroke-width: 5; stroke-linejoin: round; }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;piv-retention-tool&#x27;);
  const svg = root.querySelector(&#x27;.prt-chart&#x27;);
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  const W = 736, H = 250;
  const m = { top: 42, right: 28, bottom: 62, left: 72 };
  const pw = W - m.left - m.right;
  const ph = H - m.top - m.bottom;
  const tMin = 0.001, tMax = 1000;
  const sx = t =&gt; m.left + (Math.log10(Math.max(tMin, Math.min(tMax, t))) - Math.log10(tMin)) / (Math.log10(tMax) - Math.log10(tMin)) * pw;
  const add = (name, attrs = {}, text = &#x27;&#x27;, parent = svg) =&gt; {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([k, v]) =&gt; node.setAttribute(k, v));
    if (text) node.textContent = text;
    parent.appendChild(node);
    return node;
  };
  const val = id =&gt; Math.max(0, Number(root.querySelector(`#${id}`).value) || 0);
  const fmtMs = ms =&gt; ms &lt; 0.01 ? `${(ms * 1000).toFixed(1)} µs` : ms &lt; 1 ? `${ms.toFixed(3)} ms` : ms &lt; 100 ? `${ms.toFixed(2)} ms` : `${ms.toFixed(1)} ms`;
  const fmtLength = metres =&gt; metres &lt; 0.001 ? `${(metres * 1e6).toFixed(0)} µm` : metres &lt; 1 ? `${(metres * 1000).toFixed(metres &lt; 0.01 ? 1 : 0)} mm` : `${metres.toFixed(2)} m`;
  const standardWindows = [8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024];
  const nextStandardWindow = value =&gt; standardWindows.find(size =&gt; size &gt;= value) || standardWindows[standardWindows.length - 1];
  const previousStandardWindow = value =&gt; standardWindows.slice().reverse().find(size =&gt; size &lt;= value) || standardWindows[0];

  const defs = add(&#x27;defs&#x27;);
  const clip = add(&#x27;clipPath&#x27;, { id: &#x27;prt-clip&#x27; }, &#x27;&#x27;, defs);
  add(&#x27;rect&#x27;, { x: m.left, y: m.top, width: pw, height: ph }, &#x27;&#x27;, clip);
  const zones = add(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#prt-clip)&#x27; });
  const dynamic = add(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#prt-clip)&#x27; });
  const labels = add(&#x27;g&#x27;);
  const ticks = [0.001, 0.01, 0.1, 1, 10, 100, 1000];
  const tickLabels = [&#x27;1 µs&#x27;, &#x27;10 µs&#x27;, &#x27;0.1 ms&#x27;, &#x27;1 ms&#x27;, &#x27;10 ms&#x27;, &#x27;100 ms&#x27;, &#x27;1 s&#x27;];
  ticks.forEach((t, i) =&gt; {
    const x = sx(t);
    add(&#x27;line&#x27;, { x1: x, y1: m.top, x2: x, y2: m.top + ph, class: &#x27;prt-grid&#x27; });
    add(&#x27;text&#x27;, { x, y: m.top + ph + 28, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-tick&#x27; }, tickLabels[i]);
  });
  add(&#x27;line&#x27;, { x1: m.left, y1: m.top + ph, x2: m.left + pw, y2: m.top + ph, class: &#x27;prt-axis&#x27; });
  add(&#x27;text&#x27;, { x: m.left + pw / 2, y: H - 12, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-label&#x27; }, &#x27;Pulse-pair separation, Δt&#x27;);

  const samplingSvg = root.querySelector(&#x27;.prt-sampling-chart&#x27;);
  const SW = 736, SH = 410;
  const sm = { top: 30, right: 28, bottom: 72, left: 92 };
  const spw = SW - sm.left - sm.right;
  const sph = SH - sm.top - sm.bottom;
  const slMin = 1e-4, slMax = 2;
  const suMin = 1e-3, suMax = 10;
  const ssx = length =&gt; sm.left + (Math.log10(Math.max(slMin, Math.min(slMax, length))) - Math.log10(slMin)) / (Math.log10(slMax) - Math.log10(slMin)) * spw;
  const ssy = speed =&gt; sm.top + sph - (Math.log10(Math.max(suMin, Math.min(suMax, speed))) - Math.log10(suMin)) / (Math.log10(suMax) - Math.log10(suMin)) * sph;
  const sClampX = x =&gt; Math.max(sm.left, Math.min(sm.left + spw, x));
  const samplingDefs = add(&#x27;defs&#x27;, {}, &#x27;&#x27;, samplingSvg);
  const samplingClip = add(&#x27;clipPath&#x27;, { id: &#x27;prt-sampling-clip&#x27; }, &#x27;&#x27;, samplingDefs);
  add(&#x27;rect&#x27;, { x: sm.left, y: sm.top, width: spw, height: sph }, &#x27;&#x27;, samplingClip);
  const samplingDynamic = add(&#x27;g&#x27;, { &#x27;clip-path&#x27;: &#x27;url(#prt-sampling-clip)&#x27; }, &#x27;&#x27;, samplingSvg);
  const samplingXTicks = [1e-4, 1e-3, 1e-2, 1e-1, 1];
  const samplingXLabels = [&#x27;0.1 mm&#x27;, &#x27;1 mm&#x27;, &#x27;1 cm&#x27;, &#x27;10 cm&#x27;, &#x27;1 m&#x27;];
  const samplingYTicks = [1e-3, 1e-2, 1e-1, 1, 10];
  const samplingYLabels = [&#x27;1 mm/s&#x27;, &#x27;1 cm/s&#x27;, &#x27;0.1 m/s&#x27;, &#x27;1 m/s&#x27;, &#x27;10 m/s&#x27;];
  samplingXTicks.forEach((value, i) =&gt; {
    const x = ssx(value);
    add(&#x27;line&#x27;, { x1: x, y1: sm.top, x2: x, y2: sm.top + sph, class: &#x27;prt-sampling-grid&#x27; }, &#x27;&#x27;, samplingSvg);
    add(&#x27;text&#x27;, { x, y: sm.top + sph + 29, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-sampling-tick&#x27; }, samplingXLabels[i], samplingSvg);
  });
  samplingYTicks.forEach((value, i) =&gt; {
    const y = ssy(value);
    add(&#x27;line&#x27;, { x1: sm.left, y1: y, x2: sm.left + spw, y2: y, class: &#x27;prt-sampling-grid&#x27; }, &#x27;&#x27;, samplingSvg);
    add(&#x27;text&#x27;, { x: sm.left - 14, y: y + 5, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;prt-sampling-tick&#x27; }, samplingYLabels[i], samplingSvg);
  });
  add(&#x27;line&#x27;, { x1: sm.left, y1: sm.top + sph, x2: sm.left + spw, y2: sm.top + sph, class: &#x27;prt-sampling-axis&#x27; }, &#x27;&#x27;, samplingSvg);
  add(&#x27;line&#x27;, { x1: sm.left, y1: sm.top, x2: sm.left, y2: sm.top + sph, class: &#x27;prt-sampling-axis&#x27; }, &#x27;&#x27;, samplingSvg);
  add(&#x27;text&#x27;, { x: sm.left + spw / 2, y: SH - 14, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-sampling-label&#x27; }, &#x27;Streamwise structure length, L&#x27;, samplingSvg);
  add(&#x27;text&#x27;, { x: 22, y: sm.top + sph / 2, transform: `rotate(-90 22 ${sm.top + sph / 2})`, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-sampling-label&#x27; }, &#x27;Convection velocity, Uc&#x27;, samplingSvg);
  const samplingLabels = add(&#x27;g&#x27;, {}, &#x27;&#x27;, samplingSvg);

  const updateSampling = (rate, mean, urms, k, designU, structureM) =&gt; {
    while (samplingDynamic.firstChild) samplingDynamic.removeChild(samplingDynamic.firstChild);
    while (samplingLabels.firstChild) samplingLabels.removeChild(samplingLabels.firstChild);
    const left = sm.left, right = sm.left + spw, top = sm.top, bottom = sm.top + sph;
    const theoryTop = sClampX(ssx(2 * suMax / rate));
    const theoryBottom = sClampX(ssx(2 * suMin / rate));
    const conservativeTop = sClampX(ssx(5 * suMax / rate));
    const conservativeBottom = sClampX(ssx(5 * suMin / rate));
    add(&#x27;polygon&#x27;, { points: `${left},${top} ${theoryTop},${top} ${theoryBottom},${bottom} ${left},${bottom}`, class: &#x27;prt-sampling-unresolved&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;polygon&#x27;, { points: `${theoryTop},${top} ${conservativeTop},${top} ${conservativeBottom},${bottom} ${theoryBottom},${bottom}`, class: &#x27;prt-sampling-theory-zone&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;polygon&#x27;, { points: `${conservativeTop},${top} ${right},${top} ${right},${bottom} ${conservativeBottom},${bottom}`, class: &#x27;prt-sampling-conservative-zone&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;line&#x27;, { x1: theoryBottom, y1: bottom, x2: theoryTop, y2: top, class: &#x27;prt-sampling-theory-line&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;line&#x27;, { x1: conservativeBottom, y1: bottom, x2: conservativeTop, y2: top, class: &#x27;prt-sampling-conservative-line&#x27; }, &#x27;&#x27;, samplingDynamic);

    const lowU = Math.max(suMin, mean - k * urms);
    const highU = Math.min(suMax, Math.max(suMin, mean + k * urms));
    const shownMeanU = Math.min(suMax, Math.max(suMin, mean));
    const shownDesignU = Math.min(suMax, Math.max(suMin, designU));
    add(&#x27;rect&#x27;, { x: left, y: ssy(highU), width: spw, height: Math.max(1, ssy(lowU) - ssy(highU)), class: &#x27;prt-sampling-flow-band&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;line&#x27;, { x1: left, y1: ssy(shownMeanU), x2: right, y2: ssy(shownMeanU), class: &#x27;prt-sampling-mean-line&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;line&#x27;, { x1: left, y1: ssy(shownDesignU), x2: right, y2: ssy(shownDesignU), class: &#x27;prt-sampling-speed-line&#x27; }, &#x27;&#x27;, samplingDynamic);

    const theoryLength = 2 * designU / rate;
    const conservativeLength = 5 * designU / rate;
    add(&#x27;circle&#x27;, { cx: sClampX(ssx(theoryLength)), cy: ssy(shownDesignU), r: 7, class: &#x27;prt-sampling-theory-marker&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;circle&#x27;, { cx: sClampX(ssx(conservativeLength)), cy: ssy(shownDesignU), r: 7, class: &#x27;prt-sampling-conservative-marker&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;text&#x27;, { x: left + 9, y: ssy(shownDesignU) - 10, class: &#x27;prt-sampling-label&#x27; }, `Mean + ${k.toFixed(k % 1 ? 1 : 0)} RMS = ${designU.toFixed(3)} m/s`, samplingLabels);
    add(&#x27;text&#x27;, { x: right - 9, y: ssy(shownMeanU) + 20, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;prt-sampling-label&#x27; }, `Mean = ${mean.toFixed(3)} m/s`, samplingLabels);
    const structureX = sClampX(ssx(structureM));
    add(&#x27;line&#x27;, { x1: structureX, y1: top, x2: structureX, y2: bottom, class: &#x27;prt-sampling-structure-line&#x27; }, &#x27;&#x27;, samplingDynamic);
    add(&#x27;text&#x27;, { x: structureX, y: bottom - 10, &#x27;text-anchor&#x27;: structureX &gt; left + spw * 0.75 ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;prt-sampling-label&#x27; }, ` Desired L = ${fmtLength(structureM)}`, samplingLabels);

    const zoneY = top + 24;
    const zoneLabels = [
      [left, theoryTop, &#x27;Unresolved&#x27;],
      [theoryTop, conservativeTop, &#x27;2–5 samples&#x27;],
      [conservativeTop, right, &#x27;≥5 samples&#x27;]
    ];
    zoneLabels.forEach(([start, end, text]) =&gt; {
      if (end - start &gt; 72) add(&#x27;text&#x27;, { x: (start + end) / 2, y: zoneY, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-sampling-label&#x27; }, text, samplingLabels);
    });

    root.querySelector(&#x27;#prt-frequency-limits&#x27;).textContent = `Frequency limits: ${(rate / 2).toFixed(2)} Hz theoretical and ${(rate / 5).toFixed(2)} Hz conservative.`;
    root.querySelector(&#x27;#prt-length-limits&#x27;).textContent = `At mean + ${k.toFixed(k % 1 ? 1 : 0)} RMS: ${fmtLength(theoryLength)} theoretical and ${fmtLength(conservativeLength)} conservative.`;
  };

  const renderRecommendations = parameters =&gt; {
    const {
      laserFixed, rate, dt, designU, actualPx, allowedPx, shiftFraction,
      scale, windowPx, overlap, structureMm, independentWidths, vectorSamples,
      actualSheet, allowedSheet, dtSheet, temporalSamples, spatialStatus,
      temporalStatus, status
    } = parameters;
    const items = [];
    const recommend = (heading, detail) =&gt; items.push({ heading, detail });
    const maxSpatialWindowPx = structureMm / Math.max(3 * scale, 1e-12);

    if (actualSheet &gt; allowedSheet) {
      if (laserFixed) {
        recommend(
          &#x27;Out-of-plane particle loss cannot be recovered by processing.&#x27;,
          `The design traversal is ${actualSheet.toFixed(3)} mm versus the ${allowedSheet.toFixed(3)} mm limit. Mask low-correlation regions and reject unreliable vectors, but retaining instantaneous pairs requires a thicker effective sheet or Δt below ${fmtMs(0.8 * dtSheet)}.`
        );
      } else {
        recommend(
          &#x27;Shorten the pulse-pair separation for sheet retention.&#x27;,
          `Set Δt to ${fmtMs(0.8 * dtSheet)} or less. Processing cannot reconstruct particles after they leave the illuminated sheet.`
        );
      }
    }

    if (actualPx &gt; allowedPx) {
      const requiredInitialPx = nextStandardWindow(actualPx / Math.max(0.8 * shiftFraction, 0.01));
      const finalWindowPx = previousStandardWindow(Math.min(windowPx, maxSpatialWindowPx));
      if (laserFixed) {
        if (requiredInitialPx &lt; 1024) {
          recommend(
            &#x27;Use a larger predictor pass with window deformation.&#x27;,
            `Start near ${requiredInitialPx}×${requiredInitialPx} px to capture the ${actualPx.toFixed(1)} px displacement, then deform and reduce toward ${finalWindowPx}×${finalWindowPx} px. Confirm the final pass retains a distinct correlation peak.`
          );
        } else {
          recommend(
            &#x27;The in-plane displacement is beyond a practical processing correction.&#x27;,
            `The calculated shift is ${actualPx.toFixed(1)} px. A very large search window would strongly filter the flow; shorter Δt or a wider field of view is needed.`
          );
        }
      } else {
        const targetDt = dt * allowedPx * 0.8 / Math.max(actualPx, 1e-12);
        recommend(
          &#x27;Shorten the pulse-pair separation.&#x27;,
          `Use approximately ${fmtMs(targetDt)} or less to return the design displacement to 80% of the configured correlation limit.`
        );
      }
    } else if (actualPx &lt; 2 &amp;&amp; designU &gt; 0) {
      if (laserFixed) {
        recommend(
          &#x27;Protect precision at low particle-image displacement.&#x27;,
          `The design shift is only ${actualPx.toFixed(2)} px. Use a calibrated subpixel peak estimator, remove image bias carefully, and consider ensemble correlation for statistically stationary measurements.`
        );
      } else {
        const targetDt = 4 * scale / designU;
        recommend(
          &#x27;Increase pulse separation to improve displacement precision.&#x27;,
          `A Δt near ${fmtMs(targetDt)} would produce about 4 px displacement, provided it remains below the sheet-retention and correlation limits.`
        );
      }
    }

    if (independentWidths &lt; 3) {
      const suggestedFinalPx = previousStandardWindow(maxSpatialWindowPx);
      if (maxSpatialWindowPx &gt;= standardWindows[0]) {
        recommend(
          &#x27;Reduce the final interrogation window.&#x27;,
          `Finish near ${suggestedFinalPx}×${suggestedFinalPx} px so the ${structureMm.toFixed(1)} mm structure spans about three independent window widths. Use larger early passes only as predictors.`
        );
      } else {
        recommend(
          &#x27;The desired structure is below the current optical sampling limit.&#x27;,
          `Even an ${standardWindows[0]} px final window is too wide for three independent samples. Increase magnification, reduce the field of view, or use a higher-resolution camera.`
        );
      }
    } else if (vectorSamples &lt; 5) {
      const requiredOverlap = Math.max(0, Math.min(0.75, 1 - structureMm / Math.max(5 * windowPx * scale, 1e-12)));
      const suggestedOverlap = Math.ceil(requiredOverlap * 20) * 5;
      recommend(
        &#x27;Increase overlap to improve vector-grid sampling.&#x27;,
        `Try about ${Math.max(suggestedOverlap, Math.round(overlap * 100))}% overlap to place at least five vectors across the desired structure. This increases vector density, not independent spatial resolution.`
      );
    } else if (overlap &gt; 0.75) {
      recommend(
        &#x27;Avoid relying on very high overlap as added resolution.&#x27;,
        `${Math.round(overlap * 100)}% overlap produces strongly correlated neighboring vectors. Reduce it toward 50–75% unless dense output is specifically required.`
      );
    }

    if (temporalSamples &lt; 5) {
      const conservativeLengthMm = 5 * designU / rate * 1000;
      if (laserFixed) {
        recommend(
          temporalSamples &lt; 2 ? &#x27;Do not interpret the desired scale as time resolved.&#x27; : &#x27;Treat the desired scale as marginally time resolved.&#x27;,
          `The structure receives ${temporalSamples.toFixed(2)} fields during advection. With fixed ${rate.toFixed(1)} Hz sampling, restrict conservative time-resolved claims to structures of roughly ${conservativeLengthMm.toFixed(0)} mm or larger; phase or ensemble averaging is appropriate only for repeatable flow.`
        );
      } else {
        const requiredRate = 5 * designU / Math.max(structureMm / 1000, 1e-12);
        recommend(
          &#x27;Increase the velocity-field acquisition rate.&#x27;,
          `Approximately ${requiredRate.toFixed(1)} Hz is needed for five fields across the ${structureMm.toFixed(1)} mm structure at the design velocity.`
        );
      }
    }

    if (status === &#x27;pass&#x27; &amp;&amp; spatialStatus === &#x27;pass&#x27; &amp;&amp; temporalStatus === &#x27;pass&#x27; &amp;&amp; actualPx &gt;= 2) {
      recommend(
        &#x27;Keep the current core settings.&#x27;,
        &#x27;All three checks are conservative. Preserve the current timing and final window unless validation shows a systematic bias or unacceptable vector loss.&#x27;
      );
    }

    recommend(
      &#x27;Run a processing-sensitivity check before production.&#x27;,
      &#x27;Compare the chosen final window with one standard size above and below. Inspect valid-vector yield, peak ratio, spatial smoothing, mean bias, RMS stability, and an uncertainty estimate on representative image pairs.&#x27;
    );

    root.querySelector(&#x27;#prt-recommendation-mode&#x27;).textContent = laserFixed ? &#x27;Fixed laser timing&#x27; : &#x27;Acquisition adjustable&#x27;;
    const list = root.querySelector(&#x27;#prt-recommendations&#x27;);
    list.replaceChildren();
    items.slice(0, 5).forEach(item =&gt; {
      const row = document.createElement(&#x27;li&#x27;);
      const heading = document.createElement(&#x27;strong&#x27;);
      const detail = document.createElement(&#x27;span&#x27;);
      heading.textContent = item.heading;
      detail.textContent = ` ${item.detail}`;
      row.append(heading, detail);
      list.appendChild(row);
    });
  };

  const controls = Array.from(root.querySelectorAll(&#x27;input&#x27;));
  const useRate = root.querySelector(&#x27;#prt-use-rate&#x27;);
  const update = () =&gt; {
    const rate = Math.max(val(&#x27;prt-rate&#x27;), 1e-9);
    const dt = Math.max(val(&#x27;prt-dt&#x27;), tMin);
    const mean = val(&#x27;prt-mean&#x27;);
    const urms = val(&#x27;prt-urms&#x27;);
    const k = val(&#x27;prt-k&#x27;);
    const fov = Math.max(val(&#x27;prt-fov&#x27;), 1e-9);
    const pixels = Math.max(val(&#x27;prt-pixels&#x27;), 1);
    const windowPx = Math.max(val(&#x27;prt-window&#x27;), 1);
    const shiftFraction = val(&#x27;prt-shift-fraction&#x27;) / 100;
    const sheet = Math.max(val(&#x27;prt-sheet&#x27;), 1e-9);
    const wrms = val(&#x27;prt-wrms&#x27;);
    const sheetFraction = val(&#x27;prt-sheet-fraction&#x27;) / 100;
    const overlap = Math.min(0.99, val(&#x27;prt-overlap&#x27;) / 100);
    const structureMm = Math.max(val(&#x27;prt-structure&#x27;), 1e-9);
    const laserFixed = root.querySelector(&#x27;#prt-laser-fixed&#x27;).checked;

    const designU = mean + k * urms;
    const scale = fov / pixels;
    const allowedPx = windowPx * shiftFraction;
    const actualPx = designU * dt / scale;
    const dtImage = designU &gt; 0 ? allowedPx * scale / designU : tMax;
    const designW = k * wrms;
    const allowedSheet = sheet * sheetFraction;
    const actualSheet = designW * dt / 1000;
    const dtSheet = designW &gt; 0 ? 1000 * allowedSheet / designW : tMax;
    const hardLimit = Math.min(dtImage, dtSheet);
    const recommended = 0.8 * hardLimit;
    const rateInterval = 1000 / rate;
    const limiter = dtImage &lt;= dtSheet ? &#x27;image displacement&#x27; : &#x27;sheet loss&#x27;;
    const status = dt &lt;= recommended ? &#x27;pass&#x27; : dt &lt;= hardLimit ? &#x27;margin&#x27; : &#x27;fail&#x27;;
    const windowMm = windowPx * scale;
    const vectorSpacingMm = windowMm * (1 - overlap);
    const independentWidths = structureMm / windowMm;
    const vectorSamples = structureMm / vectorSpacingMm;
    const temporalSamples = designU &gt; 0 ? rate * (structureMm / 1000) / designU : Infinity;
    const spatialStatus = independentWidths &gt;= 3 &amp;&amp; vectorSamples &gt;= 5 ? &#x27;pass&#x27; : independentWidths &gt;= 2 &amp;&amp; vectorSamples &gt;= 3 ? &#x27;margin&#x27; : &#x27;fail&#x27;;
    const temporalStatus = temporalSamples &gt;= 5 ? &#x27;pass&#x27; : temporalSamples &gt;= 2 ? &#x27;margin&#x27; : &#x27;fail&#x27;;

    root.querySelector(&#x27;#prt-shift-value&#x27;).textContent = `${actualPx.toFixed(1)} px`;
    root.querySelector(&#x27;#prt-shift-limit&#x27;).textContent = `configured limit ${allowedPx.toFixed(1)} px`;
    root.querySelector(&#x27;#prt-sheet-value&#x27;).textContent = `${actualSheet.toFixed(actualSheet &lt; 0.01 ? 4 : 3)} mm`;
    root.querySelector(&#x27;#prt-sheet-limit&#x27;).textContent = `configured limit ${allowedSheet.toFixed(3)} mm`;
    root.querySelector(&#x27;#prt-recommended&#x27;).textContent = `≤ ${fmtMs(recommended)}`;
    root.querySelector(&#x27;#prt-limiter&#x27;).textContent = `limited by ${limiter}`;
    root.querySelector(&#x27;#prt-cadence-note&#x27;).textContent = `${rate.toFixed(1)} Hz gives one velocity field every ${fmtMs(rateInterval)}; pulse-pair separation is independent.`;

    const statusEl = root.querySelector(&#x27;#prt-status&#x27;);
    const detailEl = root.querySelector(&#x27;#prt-result-detail&#x27;);
    if (status === &#x27;pass&#x27;) {
      statusEl.textContent = &#x27;Settings are within the conservative region&#x27;;
      detailEl.textContent = `Design velocities: ${designU.toFixed(3)} m/s in-plane and ${designW.toFixed(1)} mm/s out-of-plane.`;
    } else if (status === &#x27;margin&#x27;) {
      statusEl.textContent = &#x27;Settings have little correlation margin&#x27;;
      detailEl.textContent = `Reduce Δt to ${fmtMs(recommended)} or less; the configured ${limiter} threshold is reached at ${fmtMs(hardLimit)}.`;
    } else {
      statusEl.textContent = &#x27;Particle-pair loss is likely&#x27;;
      detailEl.textContent = `Reduce Δt below ${fmtMs(hardLimit)}; a conservative target is ${fmtMs(recommended)} or less.`;
    }

    root.querySelector(&#x27;#prt-pair-check&#x27;).textContent = status === &#x27;pass&#x27; ? &#x27;Conservative&#x27; : status === &#x27;margin&#x27; ? &#x27;Limited margin&#x27; : &#x27;Likely loss&#x27;;
    root.querySelector(&#x27;#prt-pair-context&#x27;).textContent = status === &#x27;pass&#x27; ? &#x27;Both retention limits pass&#x27; : status === &#x27;margin&#x27; ? `Reduce Δt toward ${fmtMs(recommended)}` : `${limiter} limit exceeded`;
    root.querySelector(&#x27;#prt-spatial-check&#x27;).textContent = `${independentWidths.toFixed(1)} window widths`;
    root.querySelector(&#x27;#prt-spatial-context&#x27;).textContent = `${vectorSamples.toFixed(1)} plotted vectors — ${spatialStatus === &#x27;pass&#x27; ? &#x27;conservative&#x27; : spatialStatus === &#x27;margin&#x27; ? &#x27;theoretical&#x27; : &#x27;insufficient&#x27;}`;
    root.querySelector(&#x27;#prt-temporal-check&#x27;).textContent = Number.isFinite(temporalSamples) ? `${temporalSamples.toFixed(2)} fields` : &#x27;No advection limit&#x27;;
    root.querySelector(&#x27;#prt-temporal-context&#x27;).textContent = temporalStatus === &#x27;pass&#x27; ? &#x27;At least five samples&#x27; : temporalStatus === &#x27;margin&#x27; ? &#x27;Two to five samples&#x27; : &#x27;Fewer than two samples&#x27;;
    renderRecommendations({
      laserFixed, rate, dt, designU, actualPx, allowedPx, shiftFraction,
      scale, windowPx, overlap, structureMm, independentWidths, vectorSamples,
      actualSheet, allowedSheet, dtSheet, temporalSamples, spatialStatus,
      temporalStatus, status
    });

    while (zones.firstChild) zones.removeChild(zones.firstChild);
    while (dynamic.firstChild) dynamic.removeChild(dynamic.firstChild);
    while (labels.firstChild) labels.removeChild(labels.firstChild);
    const xRec = sx(recommended);
    const xHard = sx(hardLimit);
    add(&#x27;rect&#x27;, { x: m.left, y: m.top, width: Math.max(0, xRec - m.left), height: ph, class: &#x27;prt-conservative-zone prt-dynamic&#x27; }, &#x27;&#x27;, zones);
    add(&#x27;rect&#x27;, { x: xRec, y: m.top, width: Math.max(0, xHard - xRec), height: ph, class: &#x27;prt-margin-zone prt-dynamic&#x27; }, &#x27;&#x27;, zones);
    add(&#x27;rect&#x27;, { x: xHard, y: m.top, width: Math.max(0, m.left + pw - xHard), height: ph, class: &#x27;prt-fail-zone prt-dynamic&#x27; }, &#x27;&#x27;, zones);

    const xImage = sx(dtImage);
    const xSheet = sx(dtSheet);
    const xChoice = sx(dt);
    const xRate = sx(rateInterval);
    add(&#x27;line&#x27;, { x1: xImage, y1: m.top, x2: xImage, y2: m.top + ph, class: &#x27;prt-image-line prt-dynamic&#x27; }, &#x27;&#x27;, dynamic);
    add(&#x27;line&#x27;, { x1: xSheet, y1: m.top, x2: xSheet, y2: m.top + ph, class: &#x27;prt-sheet-line prt-dynamic&#x27; }, &#x27;&#x27;, dynamic);
    add(&#x27;line&#x27;, { x1: xRate, y1: m.top, x2: xRate, y2: m.top + ph, class: &#x27;prt-rate-line prt-dynamic&#x27; }, &#x27;&#x27;, dynamic);
    add(&#x27;line&#x27;, { x1: xChoice, y1: m.top, x2: xChoice, y2: m.top + ph, class: &#x27;prt-choice-line prt-dynamic&#x27; }, &#x27;&#x27;, dynamic);

    add(&#x27;text&#x27;, { x: m.left + 10, y: m.top + 24, class: &#x27;prt-zone-label&#x27; }, &#x27;Conservative&#x27;, labels);
    add(&#x27;text&#x27;, { x: xChoice, y: m.top - 20, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;prt-label&#x27; }, `Chosen ${fmtMs(dt)}`, labels);
    add(&#x27;text&#x27;, { x: xImage, y: m.top + ph - 42, &#x27;text-anchor&#x27;: xImage &gt; m.left + pw * 0.75 ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;prt-label&#x27; }, ` Image limit ${fmtMs(dtImage)}`, labels);
    add(&#x27;text&#x27;, { x: xSheet, y: m.top + ph - 17, &#x27;text-anchor&#x27;: xSheet &gt; m.left + pw * 0.75 ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;prt-label&#x27; }, ` Sheet limit ${fmtMs(dtSheet)}`, labels);
    add(&#x27;text&#x27;, { x: xRate, y: m.top + 23, &#x27;text-anchor&#x27;: xRate &gt; m.left + pw * 0.75 ? &#x27;end&#x27; : &#x27;start&#x27;, class: &#x27;prt-label&#x27; }, ` 1/${rate.toFixed(1)} Hz`, labels);
    updateSampling(rate, mean, urms, k, designU, structureMm / 1000);
  };

  controls.forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, update));
  useRate.addEventListener(&#x27;click&#x27;, () =&gt; {
    const rate = Math.max(val(&#x27;prt-rate&#x27;), 1e-9);
    root.querySelector(&#x27;#prt-dt&#x27;).value = (1000 / rate).toFixed(3);
    update();
  });
  update();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
